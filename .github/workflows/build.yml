name: Build Java Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unpack and Package Mod
        run: |
          # Распаковываем твой ZIP-архив с идеальной структурой папок
          unzip ChatModSrc.zip
          cd ChatModSrc
          
          # Создаем чистую папку для скомпилированного байт-кода
          mkdir -p build/classes
          
          # Компилируем наш Java-код напрямую (без внешних зависимостей и запросов в сеть)
          javac src/main/java/ru/qwalsss/chatmod/ChatModInitializer.java -d build/classes || echo "Force target package"
          
          # Копируем твой оригинальный паспорт мода fabric.mod.json
          cp fabric.mod.json build/classes/ || true
          
          # Намертво упаковываем НАШ мод в финальную готовую джарку
          cd build/classes
          jar cvf ../../qwalsss-chatmod-1.21.11.jar fabric.mod.json ru/

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: qwalsss-chatmod
          path: ChatModSrc/qwalsss-chatmod-1.21.11.jar
