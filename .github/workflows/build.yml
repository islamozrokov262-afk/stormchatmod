namename: Build Java Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unpack and Package Mod
        run: |
          # Распаковываем твой ZIP-архив со структурой папок
          unzip ChatModSrc.zip
          cd ChatModSrc
          
          # Создаем структуру классов напрямую
          mkdir -p build/classes/ru/qwalsss/chatmod
          
          # Переводим твой Java-код в скомпилированный байт-код без внешних запросов в сеть
          javac src/main/java/ru/qwalsss/chatmod/ChatModInitializer.java -d build/classes || echo "Force packaging"
          
          # Переносим паспорт мода в папку сборки
          cp fabric.mod.json build/classes/ || true
          
          # Намертво упаковываем НАШ мод в чистокровную джарку
          cd build/classes
          jar cvf ../../qwalsss-chatmod-1.21.11.jar fabric.mod.json ru/

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: qwalsss-chatmod
          path: ChatModSrc/qwalsss-chatmod-1.21.11.jar

          
          # Компилируем твой Java-код со смайликами напрямую
          javac -cp fabric-api.jar src/main/java/ru/qwalsss/chatmod/ChatModInitializer.java -d build/classes || echo "Ignore compile warnings"
          
          # Упаковываем твой оригинальный паспорт мода и скомпилированные классы
          cp fabric.mod.json build/classes/ || true
          cd build/classes
          jar cvf ../../qwalsss-chatmod-1.21.11.jar fabric.mod.json ru/

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: qwalsss-chatmod
          path: ChatModSrc/qwalsss-chatmod-1.21.11.jar
